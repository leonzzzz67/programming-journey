<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Style</title>
    <style>
        @import url(https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Playwrite+CU+Guides&display=swap);
        .px {
            
            font-size: 20px;
            
        }
        .persn {
            font-size: 150%;
        }
        .em {
            font-size: 2em;
        }
        .rem {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="px">"Font Style dengan satuan pixel (px)"</div>
    <div class="persn">"Font Style dengan satuan persen (%)"</div>
    <div class="em">"Font Style dengan satuan em"</div>
    <div class="rem">"Font Style dengan satuan rem"</div>
</body>
</html>
