<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Reflek</title>
    <link rel="stylesheet" href="Body.css">
    <style>
         .title{
      width:700px;
      max-width:90%;
      margin:0 auto 40px;
      background:white;
      border-radius:50px;
      padding:18px;
      text-align:center;
      font-size:42px;
      font-weight:700;
      font-family:'Baloo 2', cursive;
      box-shadow:10px 10px ;
         }
   
    body {
        background-image: url(✨Stars\ mobile\ wallpaper\ 1080x1920✨.jpg);
    }
    </style>
</head>
<body>
    <div class="title">
        Tes reflek
    </div>
    
    <!-- Kotak Refleks -->
<div class="title">
    <p>Seberapa cepat refleksmu?</p>
    
    <br>

    <!-- Area Permainan -->
    <div id="game-area" class="game-box" onclick="playGame()">
        <p id="game-text">Klik di sini untuk Mulai</p>
    </div>

    <!-- 2. JAVASCRIPT (HARUS DI BAWAH INI) -->
    <script>
    const gameArea = document.getElementById('game-area');
    const gameText = document.getElementById('game-text');

    let startTime;
    let endTime;
    let gameState = 'start'; // status: start, waiting, now, result

    function playGame() {
        if (gameState === 'start' || gameState === 'result') {
            // 1. Mulai Permainan
            startGame();
        } else if (gameState === 'waiting') {
            // 2. Jika klik terlalu cepat (sebelum hijau)
            tooEarly();
        } else if (gameState === 'now') {
            // 3. Jika klik pada waktu yang tepat (saat hijau)
            stopGame();
        }
    }

    function startGame() {
        gameState = 'waiting';
        gameText.textContent = "Tunggu warna berubah hijau...";
        gameArea.className = 'game-box waiting'; // Ubah warna jadi biru

        // Set waktu acak antara 2 sampai 5 detik
        let randomTime = Math.random() * 3000 + 2000;

        setTimeout(() => {
            if (gameState === 'waiting') {
                gameState = 'now';
                gameText.textContent = "KLIK SEKARANG!!!";
                gameArea.className = 'game-box now'; // Ubah warna jadi hijau
                startTime = Date.now(); // Catat waktu mulai
            }
        }, randomTime);
    }

    function stopGame() {
        endTime = Date.now(); // Catat waktu berhenti
        let reactionTime = endTime - startTime; // Hitung selisih waktu
        
        gameState = 'result';
        gameText.textContent = `Waktu: ${reactionTime} ms. Klik untuk ulang.`;
        gameArea.className = 'game-box'; // Kembalikan ke warna default
    }

    function tooEarly() {
        gameState = 'result';
        gameText.textContent = "Terlalu cepat! Klik untuk coba lagi.";
        gameArea.className = 'game-box early'; // Ubah warna jadi merah
    }
</script>
</div>
</body>
