<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap-tap</title>
    <link rel="stylesheet" href="Taps.css">
     <style>
         .title{
      width:700px;
      max-width:90%;
      margin:0 auto 40px;
      background:white;
      border-radius:50px;
      padding:18px;
      text-align:center;
      font-size:42px;
      font-weight:700;
      font-family:'Baloo 2', cursive;
      box-shadow:10px 10px ;
    }

    body {
        background-image: url(✨Stars\ mobile\ wallpaper\ 1080x1920✨.jpg);
    }
    </style>
</head>
<body>
    <!-- 3. KOTAK: TAP TAP GAME -->
<div class="title">
    <h2>TAPS</h2>
    <p>Klik saja!</p>
    
    <!-- Tampilan Skor -->
    <div class="score-box">Skor: <span id="tap-score">0</span></div>
    
    <!-- GAMBAR (Ganti src jika punya file sendiri) -->
    <!-- Saya pakai link placeholder agar langsung muncul kotaknya -->
    <img id="tap-btn" onclick="playTap()" src="UwU.png" alt="Tap Box" class="tap-area">
    
    <button onclick="resetTap()" class="btn-reset-small">Reset Skor</button>
</div>

<script>
    /* ===========================
   LOGIKA 2: TAP TAP GAME
   =========================== */
let tapScore = 0;
let isBoxOpen = false;
const tapBtn = document.getElementById('tap-btn');
const scoreDisplay = document.getElementById('tap-score');


// Link Gambar (Jika punya file sendiri, ganti url di sini)
// Contoh: const imgClosed = "kotak_tutup.png";
const imgClosed = "UwU.png";
const imgOpen   = "UoU.png";

// Load Skor saat pertama kali dibuka
window.onload = function() {
    const savedScore = localStorage.getItem('tapGameScore');
    if (savedScore) {
        tapScore = parseInt(savedScore);
        scoreDisplay.textContent = tapScore;

         }

}
    
function playTap() {
    // 1. Logika Skor
    tapScore++;
    scoreDisplay.textContent = tapScore;
    localStorage.setItem('tapGameScore', tapScore);

    // 2. Logika Ganti Gambar
    if (isBoxOpen) {
        tapBtn.src = imgClosed;
        isBoxOpen = false;
    } else {
        tapBtn.src = imgOpen;
        isBoxOpen = true;
    }

    // 3. LOGIKA SUARA (Hanya jalan baris ini jika tombol diklik)
    let clickSound = new Audio('pop.mp3'); // Membuat pemutar baru setiap klik
    clickSound.play(); // Perintah PUTAR (hanya akan jalan jika fungsi ini dipanggil)
}

function resetTap() {
    if(confirm("Yakin ingin mengulang skor dari 0?")) {
        tapScore = 0;
        scoreDisplay.textContent = tapScore;
        localStorage.setItem('tapGameScore', 0); // Simpan 0
        tapBtn.src = imgClosed; // Reset gambar ke awal
        isBoxOpen = false;
    }
}
</script>
</body>
<div style="text-align: center; margin-top: 40px; margin-bottom: 20px;">
    <!-- href="index.html" artinya kembali ke file utama -->
    <a href="Bored room.html" class="btn-home">
        🏠 Kembali ke Beranda
    </a>
</html>
