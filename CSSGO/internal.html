<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>internal CSS</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
            margin: 20px;
        }
    h1  {
        color: #333;
        }
    p  {
        color: #666;
        line-height: 1.6;
    }
    .highlight{
       background-color: yellow;
       font-weight: bold;
    }
    </style>
</head>
<body>
    <h1>Judul Halaman 1</h1>
    <p>Ini adalah sebuah paragraf dengan gaya css internal yang diterapkan</p>
    <p>paragraf kedua, juga akan terlihat sama.</p>
    <p class="highlight">paragraf ini menggunakan kelas 'highlight' untuk efek khusus</p>
</body>
</html>
