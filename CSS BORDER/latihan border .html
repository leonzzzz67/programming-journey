<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: sans-serif;
        }
        header {
            border: 2px solid blue;
            text-align: center;
            margin-bottom: 1em;
        }

        article {
            border: 2px solid fuchsia;
            padding: 1em;
            margin-bottom: 1em;
        }

        footer {
            text-align: center;
            padding: 0.5em;
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <header>
        <h1>Lathian CSS Border</h1>
    </header>
    
    <article>
        Ini adalah contoh paragraf atikel buat latihan
        properti border di CSS. Properti border adalah Properti
        untuk membuat garis pada sisis elemen HTML.Garis ini
        bergunna untuk memberikan batas antar elemen. Sehinggs,
        bisa terlihat ada pemisah dan menjadi kesatuan.
    </article>

    <footer>
        &copy; 2026 CSS - X PPLG
    </footer>
</body>
</html>
