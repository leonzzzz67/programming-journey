<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .solid {
        border: 3px solid cyan;
        padding: 10px;
        margin: 10px;
       }

       .dotted {
        border: 3px dotted pink;
        padding: 10px;
        margin: 10px;
       }

       .double {
        border: 5px double green;
        padding: 10px;
        margin: 10px;
       }

       .dashed {
         border: 3px dashed purple;
         padding: 10px;
         margin: 10px;
       }

       .groove {
         border: 6px solid yellow;
         padding: 10px;
         margin: 10px;
       }

       .ridge {
        border: 3px ridge orange;
        padding: 10px;
        margin: 10px;
       }
    </style>
</head>
</body>
    <h2>Border CSS</h2>

    <p class="solid">Ini border solid</p>
    <p class="dotted">Ini border dotted</p>
    <p class="double">Ini border double</p>
    <p class="dashed">ini border dashed</p>
    <p  class="groove">Ini border groove</p>
    <p class="ridge">ini border ridge</p>
</html>
